# =============================================================================
# keepalive.yml — منع Supabase من إيقاف المشروع بعد سبعة أيام خمول (T-01)
#
# لماذا هذا الملف موجود
# -----------------------------------------------------------------------------
# الخطة المجانية في Supabase توقف المشروع بعد ٧ أيام بلا أي طلب. وهذا يعني أن
# المنصة تموت في الإجازة الفصلية بالضبط — حين لا يفتحها أحد أسبوعاً كاملاً —
# فيعود الطلاب إلى موقع لا يعمل، ولا يعرف صاحبه أنه توقّف حتى يشتكي أحدهم.
# البند مسجّل بوصفه T-01 في 18-open-tasks.md ومصنَّف 🔴 عالية منذ البداية.
#
# والمنصة صدقة جارية: ما ينفع الناس يجب أن يبقى يعمل بلا أن يتذكّره أحد.
#
# لماذا GitHub Actions لا شيء آخر
# -----------------------------------------------------------------------------
# • مجانية للمستودعات العامة، ولا حساب جديد ولا خدمة ثالثة قد تُغلق يوماً.
# • تعمل والحاسوب مطفأ — المهمة تجري على خوادم GitHub لا على جهاز عبد.
# • تعيش في المستودع نفسه: من يقرأ المشروع بعد سنوات يرى لماذا وُجدت.
#
# ولا نستعمل `pg_cron` داخل القاعدة: نشاطها الداخلي لا يُحتسب طلباً واردة،
# فقد تتوقّف وهي «تشتغل» مع نفسها. الطلب يجب أن يأتي من **خارج** المشروع.
#
# ما يحتاجه منك — مرة واحدة
# -----------------------------------------------------------------------------
# في المستودع على GitHub:
#   Settings ← Secrets and variables ← Actions ← New repository secret
#     الاسم:  SUPABASE_URL        القيمة: https://xxxx.supabase.co
#     الاسم:  SUPABASE_ANON_KEY   القيمة: eyJ...
#
# `anon key` مكشوف بالتصميم (موجود في كود المتصفح أصلاً)، لكنّا لا نكتبه في
# المستودع التزاماً بقاعدة DEPLOY.md: لا مفتاح حقيقي في أي ملف — لأن تاريخ Git
# يحتفظ بما كُتب فيه للأبد ولو حذفته بعد دقيقة.
#
# ⚠️ لا تضع `service_role` هنا إطلاقاً [FIX SEC-03]. الطلب أدناه قراءة عامة
# لا تحتاج أكثر من `anon`.
# =============================================================================

name: keepalive

on:
  schedule:
    # كل أربعة أيام الساعة 03:15 UTC. المهلة سبعة، والهامش ثلاثة أيام يحتمل
    # تأخّر GitHub للمهام المجدولة (وهو معروف ويصل إلى ساعات في أوقات الذروة)
    # ويحتمل فشل تشغيلة كاملة دون أن تتوقّف القاعدة.
    - cron: "15 3 */4 * *"
  # يدوياً من تبويب Actions — للتجربة أو بعد إجازة طويلة
  workflow_dispatch:

# أقلّ صلاحية ممكنة: المهمة لا تكتب في المستودع شيئاً.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: طلب قراءة خفيف إلى قاعدة البيانات
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${URL:-}" ] || [ -z "${KEY:-}" ]; then
            echo "::error::السرّان SUPABASE_URL و SUPABASE_ANON_KEY غير مضبوطين. راجع أعلى هذا الملف."
            exit 1
          fi

          # صفٌّ واحد من جدول عام صغير. لا نجلب أحاديث: حصة Egress محدودة
          # (5GB شهرياً) وهذه المهمة تعمل ثمانيَ مرات في الشهر بلا فائدة تُذكر
          # من البيانات نفسها — المقصود إثبات النشاط لا القراءة.
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            "${URL}/rest/v1/collections?select=id&limit=1")

          echo "HTTP ${code}"
          head -c 300 /tmp/out.json || true
          echo

          if [ "${code}" != "200" ]; then
            echo "::error::القاعدة لم تردّ بـ200. قد يكون المشروع متوقّفاً فعلاً — افتح لوحة Supabase وأعد تشغيله."
            exit 1
          fi

          echo "::notice::القاعدة حيّة. التشغيلة القادمة بعد أربعة أيام."
